# ~/.config/starship.toml

# -------------------------
# (1) global settings
# -------------------------
# the blank line between prompts comes from a precmd hook in ~/.zshrc —
# add_newline can't skip the first prompt of a session in zsh, a hook can
add_newline = false
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$golang\
$line_break\
$character"""


# -------------------------
# (2) user profiles
# -------------------------
[aws]
disabled = true

[gcloud]
disabled = true

[username]
show_always = false

[hostname]
ssh_only = true


# -------------------------
# (3) directory
# -------------------------
[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false


# -------------------------
# (4) git
# -------------------------
[git_branch]
symbol = " "
style = "bold purple"

[git_status]
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'


# -------------------------
# 5. language decorators
# ------------------------- 
[python]
symbol = "python-"
style = "green"
[nodejs]
symbol = "node-"
style = "yellow"
[golang]
symbol = "go-"
style = "cyan"
[package]
disabled = true


# -------------------------
# (6) prompt
# -------------------------
[character]
error_symbol = "[✕](bold red)"